<!DOCTYPE html>
<html>

<head>
    <title>Student Portal Signup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
        }

        .container {
            width: 350px;
            margin: 40px auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #success {
            color: green;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Student Portal Signup</h2>

        <form id="myForm">

            <label>Full Name</label><br>
            <input type="text" id="name">
            <div class="error" id="nameError"></div>

            <label>Email</label><br>
            <input type="text" id="email">
            <div class="error" id="emailError"></div>

            <label>Password</label><br>
            <input type="password" id="password">
            <div class="error" id="passwordError"></div>

            <label>Confirm Password</label><br>
            <input type="password" id="confirmPassword">
            <div class="error" id="confirmError"></div>

            <label>Phone Number</label><br>
            <input type="text" id="phone">
            <div class="error" id="phoneError"></div>

            <button type="submit">Submit</button>

        </form>

        <p id="success"></p>

    </div>

    <script>

        let form = document.getElementById("myForm");

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            document.getElementById("nameError").innerText = "";
            document.getElementById("emailError").innerText = "";
            document.getElementById("passwordError").innerText = "";
            document.getElementById("confirmError").innerText = "";
            document.getElementById("phoneError").innerText = "";
            document.getElementById("success").innerText = "";

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let confirm = document.getElementById("confirmPassword").value;
            let phone = document.getElementById("phone").value;

            let ok = true;

            if (name == "") {
                document.getElementById("nameError").innerText = "Enter your full name";
                ok = false;
            }

            if (email == "") {
                document.getElementById("emailError").innerText = "Enter your email";
                ok = false;
            } else if (!email.includes("@") || !email.includes(".")) {
                document.getElementById("emailError").innerText = "Invalid email";
                ok = false;
            }

            if (password.length < 6) {
                document.getElementById("passwordError").innerText = "Password must be at least 6 characters";
                ok = false;
            }

            if (confirm != password) {
                document.getElementById("confirmError").innerText = "Passwords do not match";
                ok = false;
            }

            if (phone == "") {
                document.getElementById("phoneError").innerText = "Enter phone number";
                ok = false;
            } else if (isNaN(phone)) {
                document.getElementById("phoneError").innerText = "Phone number must contain only digits";
                ok = false;
            }

            if (ok == true) {
                document.getElementById("success").innerText = "Registration Successful!";
            }

        });

    </script>

</body>

</html>
