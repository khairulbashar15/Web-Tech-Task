<!DOCTYPE html>
<html>

<head>

    <title>Portfolio Theme Toggle</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
        }

        header {
            background-color: lightblue;
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid black;
        }

        main {
            margin: 20px;
            padding: 20px;
            border: 2px solid black;
            background-color: white;
        }

        footer {
            background-color: lightgray;
            text-align: center;
            padding: 15px;
            border-top: 2px solid black;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <header id="header">
        <h1>My Portfolio</h1>
        <p>Welcome to my website</p>

        <button id="themeBtn">Switch to Dark Mode</button>
    </header>

    <main id="content">
        <h2>About Me</h2>

        <p>
            Hello! I am a CSE student. I am learning HTML, CSS and JavaScript.
            This is my portfolio website.
        </p>
    </main>

    <footer id="footer">
        <p>© 2026 My Portfolio</p>
    </footer>

    <script>

        let darkMode = false;

        let body = document.body;
        let header = document.getElementById("header");
        let content = document.getElementById("content");
        let footer = document.getElementById("footer");
        let button = document.getElementById("themeBtn");

        button.onclick = function () {

            if (darkMode == false) {

                body.style.backgroundColor = "black";
                body.style.color = "white";

                header.style.backgroundColor = "gray";
                header.style.borderColor = "white";

                content.style.backgroundColor = "dimgray";
                content.style.borderColor = "white";

                footer.style.backgroundColor = "gray";
                footer.style.borderColor = "white";

                button.style.backgroundColor = "white";
                button.style.color = "black";

                button.innerHTML = "Switch to Light Mode";

                darkMode = true;

            } else {

                body.style.backgroundColor = "white";
                body.style.color = "black";

                header.style.backgroundColor = "lightblue";
                header.style.borderColor = "black";

                content.style.backgroundColor = "white";
                content.style.borderColor = "black";

                footer.style.backgroundColor = "lightgray";
                footer.style.borderColor = "black";

                button.style.backgroundColor = "white";
                button.style.color = "black";

                button.innerHTML = "Switch to Dark Mode";

                darkMode = false;

            }

        };

    </script>

</body>

</html>
