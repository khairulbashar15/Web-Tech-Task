<!DOCTYPE html>
<html>
<head>
    <title>User Card</title>

    <style>
        .card{
            position: relative;
            width: 250px;
            padding: 15px;
            border: 2px solid black;
            background-color: lightgray;
            border-radius: 10px;
        }

        .badge{
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: green;
            color: white;
            padding: 3px 8px;
        }

        img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="badge">Online</div>

    <img src="https://randomuser.me/api/portraits/men/1.jpg" alt="Profile">

    <h2>Khairul Bashar</h2>

    <p>I am a student</p>

</div>

</body>
</html>
